# bitdispatcher service settings (macOS). After a change:
#   sudo launchctl kickstart -k system/com.biodream.bitdispatcher

# The HTTPS address consoles connect to (https://<this Mac>:8443/).
BITDISPATCHER_ADDR=:8443

# The data folder: the ledger of every call and change, users, settings, the recorded map. Owned by the
# _bitdispatcher service account and closed to everyone else.
BITDISPATCHER_DATA="/Library/Application Support/bitdispatcher"

# yes keeps this Mac from sleeping while the service runs (system sleep, idle sleep and the short
# "maintenance" sleeps that pause every process): a dispatch server must answer at any time. The
# display may still turn off. no lets the Mac sleep as usual.
BITDISPATCHER_KEEP_AWAKE=yes

# Extra options, such as a certificate your network trusts (readable by _bitdispatcher):
# BITDISPATCHER_FLAGS="-tls-cert /usr/local/etc/bitdispatcher/cert.pem -tls-key /usr/local/etc/bitdispatcher/key.pem"
BITDISPATCHER_FLAGS=
